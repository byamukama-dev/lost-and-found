<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b8662"><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/css/tailwind.css"><link rel="stylesheet" href="/static/css/custom.css"><title>Verify email — CampusFind</title></head><body><header class="border-b border-ink-900/10 bg-white"><div class="container-page flex h-[74px] items-center justify-between"><a href="/index.html" class="font-display text-xl font-extrabold text-brand-700">CampusFind</a><a href="/login.html" class="btn-outline btn-sm">Log in</a></div></header><main class="container-page py-12"><section class="card mx-auto max-w-lg p-6 sm:p-8">
<h1 id="verifyHeading" class="font-display text-3xl font-extrabold">Verify your email</h1>
<p id="verifyInstruction" class="mt-3 text-sm leading-relaxed text-ink-500">Check your email for your verification code.</p>
<form id="verifyForm" class="mt-6 space-y-4">
<label class="label">Email address<input id="email" type="email" class="field mt-1.5" autocomplete="email" required></label>
<label class="label">Six-digit code<input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" class="field mt-1.5" required placeholder="000000"></label>
<p class="text-xs text-ink-500">Codes expire after 10 minutes. Check your spam folder. You can request another code after 60 seconds.</p>
<div id="passwordFields" class="hidden space-y-4">
<label class="label">New password<input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" class="field mt-1.5"></label>
<label class="label">Confirm new password<input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" class="field mt-1.5"></label>
</div>
<p id="verifyError" class="hidden rounded-xl bg-coral-50 p-4 text-sm text-coral-700" role="alert"></p>
<button type="submit" class="btn-primary w-full">Verify code</button>
<button id="resendCode" type="button" class="btn-outline w-full">Send another code</button>
</form><p class="mt-5 text-sm text-ink-500">Wrong address? <a class="text-brand-700" href="/register.html">Start registration again</a>.</p>
</section></main><script src="/static/js/common.js"></script><script src="/static/js/auth.js"></script></body></html>
